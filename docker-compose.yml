version: '3.8'

services:
  # El único contenedor expuesto al exterior (Puerto 80 público)
  reverse-proxy:
    image: nginx:alpine
    container_name: srv-monitor-nginx          # Prefijo srv (Server/Proxy)
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - red-publica                            # Solo necesita la red pública para hablarle al Front y al exterior
    depends_on:
      - monitor-front
      - monitor-back

  # Capa Front (Oculta, Nginx le habla por el 4200)
  monitor-front:
    build:
      context: ./facturacion-monitoreo-front
    container_name: app-monitoreo-frontend    # Nombre explícito y profesional
    expose:
      - "4200"
    networks:
      - red-publica                            # Se comunica con Nginx aquí
      - red-privada                            # ¡CRÍTICO! Necesita esta red para que sus llamadas de API lleguen al Back

  # Capa Back + BD en Memoria (Oculta, Nginx le habla por el 8080)
  monitor-back:
    build:
      context: .
    container_name: app-monitoreo-backend     # Nombre explícito y profesional
    expose:
      - "8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SERVER_PORT=8080
    networks:
      - red-privada                            # Totalmente aislado en la zona segura

# Aislamiento total perimetral
networks:
  red-publica:
    driver: bridge
  red-privada:
    driver: bridge
