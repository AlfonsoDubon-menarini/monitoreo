services:
  # El único contenedor expuesto al exterior (Puerto 80 público)
  reverse-proxy:
    image: nginx:alpine
    container_name: monitor-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - red-publica
      - red-privada
    depends_on:
      - monitor-front
      - monitor-back

  # Capa Front (Oculta, Nginx le habla por el 4200)
  monitor-front:
    build:
      context: ./facturacion-monitoreo-front
    container_name: e-invoice-front
    expose:
      - "4200"
    networks:
      - red-publica

  # Capa Back + BD en Memoria (Oculta, Nginx le habla por el 8080)
  monitor-back:
    build:
      context: .
    container_name: e-invoice-back
    expose:
      - "8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SERVER_PORT=8080
    networks:
      - red-privada

# Aislamiento total perimetral
networks:
  red-publica:
    driver: bridge
  red-privada:
    driver: bridge
