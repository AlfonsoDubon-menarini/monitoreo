openapi: 3.0.3
info:
  title: MVP Billing Health Monitor
  version: 1.0.0
paths:
  /api/v1/health-reports:
    post:
      summary: Recibir reporte de salud de un nodo regional
      tags: [Ingesta]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HealthReport'
      responses:
        '202':
          description: Reporte recibido y procesado

  /api/v1/regional-status:
    get:
      summary: Obtener el estado actual de toda la región (CA + RD)
      tags: [Consulta]
      responses:
        '200':
          description: Listado de salud por país
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CountryHealth'

components:
  schemas:
    HealthReport:
      type: object
      required: [country, isTaxAuthorityUp, latencyMs, pendingDocs]
      properties:
        country: { type: string, enum: [GT, SV, HN, NI, CR, PA, DO] }
        isTaxAuthorityUp: { type: boolean }
        latencyMs: { type: integer }
        pendingDocs: { type: integer }

    CountryHealth:
      type: object
      properties:
        country: { type: string }
        status: { type: string, enum: [OK, WARN, CRITICAL] }
        lastUpdate: { type: string, format: date-time }
